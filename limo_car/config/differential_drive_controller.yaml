controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


    ackermann_steering_controller:
      type: 'ackermann_steering_controller/AckermannSteeringController'


diff_drive_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    left_wheel_names: ["rear_left_wheel_joint", "front_left_wheel_joint"]
    right_wheel_names: ["rear_right_wheel_joint", "front_right_wheel_joint"]
    wheels_per_side: 2

    wheel_separation: 0.14    # your `track` value
    wheel_radius: 0.045       # your `wheel_radius` value

    base_frame_id: base_link
    odom_frame_id: odom

    position_feedback: true
    enable_odom_tf: true
    use_stamped_vel: false