controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    arm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

ackermann_steering_controller:
  ros__parameters:
    wheelbase: 0.2 # era 1.7
    front_wheel_track: 0.14 # era 1.0
    rear_wheel_track: 0.14 # era 1.0
    front_wheels_radius: 0.045 # era 0.3 
    rear_wheels_radius: 0.045 # era 0.3
    front_steering: true
    reference_timeout: 2.0 # se passano > 2s dall'ultimo comando (di vel) si ferma
    rear_wheels_names: ['rear_right_wheel_joint', 'rear_left_wheel_joint']
    front_wheels_names: ['right_wheel_steering_joint', 'left_wheel_steering_joint'] #? controlla i tipi dei joint
    use_stamped_vel: true #! era true, l'ho canbiato io
    open_loop: false
    velocity_rolling_window_size: 10
    base_frame_id: base_link
    odom_frame_id: odom # va bene se il relay è attivato altrimenti il nome del topic è diverso!
    enable_odom_tf: true 
    # [x, y, z, roll(x), pitch(y), yaw(z)] # https://wiki.ros.org/ackermann_steering_controller
    twist_covariance_diagonal: [0.001, 0.001, 1e6,   1e6,   1e6,   0.01 ]  # era [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    # pose_covariance_diagonal NON viene pubblicato in /ackermann_steering_controller/odometry 
    # strano ma per noi è irrilevante
    pose_covariance_diagonal: [0.001, 0.001,   1e6,   1e6,   1e6,   0.01 ]  # era [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    position_feedback: false

arm_group_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolate_from_desired_state: true
    open_loop_control: false
    allow_integratuion_in_goal_trajectories: true