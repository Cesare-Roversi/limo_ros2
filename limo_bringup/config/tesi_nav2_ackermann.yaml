# Configurazione standard con amcl + map server (spero)
# L'ho scelto tra i limo_ros2_onboard_ws/limo_ros2/limo_bringup/param/
# Originariamente si chiamava nav2_ackermann.yaml, l'ho modificato e gli ho cambiato il nome in tesi_nav2_ackermann.yaml



# AMCL:
# trova il frame_id del sesnore che pubblica su /scan e guarda nel tf tree: base_link -> scan 
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.05
    alpha3: 0.03
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: True
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan 

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True


# bt_navigator
# legge da /odom
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True



#! REGULATED PURE PERSUIT (SCRITTO DA CLAUDE):
# guarda solo la local_costmap;
controller_server:
  ros__parameters:
    # enable_stamped_cmd_vel: true
    odom_topic: /odom
    use_sim_time: True
    controller_frequency: 5.0
    controller_plugins: ["FollowPath"]

    # Progress checker
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # required_movement_radius: 0.5 #! [ERROR] [1777900240.925397243] [controller_server]: Failed to make progress
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    # Goal checker
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2        # mantenuto da TEB
      yaw_goal_tolerance: 0.2       # mantenuto da TEB
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- Cinematica robot (mantenuta da TEB) ---
      desired_linear_vel: 0.2          # era max_vel_x
      max_linear_accel: 0.1            # era acc_lim_x
      max_linear_decel: 0.1            # era acc_lim_x (simmetrico)
      max_angular_vel: 0.2             # era max_vel_theta
      max_angular_accel: 0.1           # era acc_lim_theta
      min_turning_radius: 0.4          # mantenuto da TEB (Ackermann nativo)

      # --- Pure Pursuit ---
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: True

      #--- Regolazioni velocità ---
      use_regulated_linear_velocity_scaling: True
      use_cost_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 0.9   # basato su min_turning_radius
      regulated_linear_scaling_min_speed: 0.1
      use_fixed_curvature_lookahead: False
      curvature_lookahead_dist: 0.25

      # --- Ostacoli (mantenuto da TEB) ---
      use_collision_detection: False
      # max_allowed_time_to_collision_up_to_carrot: 1.0
      # cost_scaling_dist: 0.6          # era inflation_dist
      # cost_scaling_gain: 1.0

      # --- Comportamento al goal ---
      allow_reversing: True           # era max_vel_x_backwards > 0

      # --- Feedback e debug ---
      use_interpolation: True
      transform_tolerance: 0.1


controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True


