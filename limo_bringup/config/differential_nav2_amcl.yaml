# Configurazione standard con amcl + map server (spero)
# L'ho scelto tra i limo_ros2_onboard_ws/limo_ros2/limo_bringup/param/
# Originariamente si chiamava nav2_ackermann.yaml, l'ho modificato e gli ho cambiato il nome in tesi_nav2_differential.yaml


amcl:
  ros__parameters:
    set_initial_pose: true
    initial_pose:
      x: 120.000
      y: 32.000
      z: 0.450000
      yaw: 0.0

    use_sim_time: True

    #* QUANTA NOISE SI ASPETTA DALL'ODOMETRIA
    # se si fida salta in giro meno.
    # deafault di tutti è 0.2
    # alpha1: 0.3
    # alpha2: 0.3
    # alpha3: 0.3
    # alpha4: 0.3
    # alpha5: 0.3
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1

    #* TRANSFORMS:
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: True
    transform_tolerance: 0.3
    save_pose_rate: 1.0
    scan_topic: scan
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"

    #* OSTACOLI DINAMICI
    # attivalo solo se metti ostacoli dinamici in simulazione
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    #* SENSORE
    # corrisponde al sensore in gazebo
    laser_model_type: "likelihood_field"
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.5
    max_beams: 360

    # "likelihood_field" usa solo z_hit e z_rand, 
    # in teoria z_hit è la problabilità che un raggio sia corretto
    # z_rand che sia sbagliato
    sigma_hit: 0.2
    z_hit: 0.9 
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    lambda_short: 0.1

    #* PARTICLE FILTER
    # raddoppiato le particelle
    min_particles: 1000 
    max_particles: 4000
    # non oso toccare
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    #* AGGIORNAMENTO
    # ogni quanto aggoirnare la posizione
    # abbassati molto x precisone piccoli movimenti
    update_min_d: 0.1 #radinati
    update_min_a: 0.1 #metri

    #* RECOVERY
    # non oso toccarli
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0



#! behavior trees preinstallati qui:
#! /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/

# bt_navigator
# legge da /odom
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_nav_to_pose_bt_xml: "$(find-pkg-share limo_bringup)/config/behaviour_trees/ackermann_navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share limo_bringup)/config/behaviour_trees/ackermann_navigate_through_poses_w_replanning_and_recovery.xml"



#* https://github.com/ros-navigation/navigation2/tree/humble/nav2_smac_planner

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: True

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      #! PRACTICAL:
      tolerance: 0.5                      # tolerance for planning if unable to reach exact pose, in meters
      allow_unknown: false                # allow traveling in unknown space
      motion_model_for_search: "REEDS_SHEPP"    # For Hybrid Dubin, Redds-Shepp
      #! I USE HIBRID NOT 2D!! cost_travel_multiplier * global_costmap_value
      # cost_travel_multiplier: 2.0         # For 2D: Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      #* tende a cercare lontano dalle zone costose della global costmap
      cost_penalty: 3.5                   # For Hybrid nodes: penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      minimum_turning_radius: 0.05        # For Hybrid/Lattice nodes: minimum turning radius in m of path / vehicle
      reverse_penalty: 1.0 #! era 2.1               # For Reeds-Shepp model: penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.8 #! era 0.5                 # For Hybrid nodes: penalty to apply if motion is changing directions, must be >= 0
      non_straight_penalty: 1.2 #! era 1.2          # For Hybrid nodes: penalty to apply if motion is non-straight, must be => 1
      retrospective_penalty: 0.025        # For Hybrid/Lattice nodes: penalty to prefer later maneuvers before earlier along the path. Saves search time since earlier nodes are not expanded until it is necessary. Must be >= 0.0 and <= 1.0
      # rotation_penalty: 5.0               # For Lattice node: Penalty to apply only to pure rotate in place commands when using minimum control sets containing rotate in place primitives. This should always be set sufficiently high to weight against this action unless strictly necessary for obstacle avoidance or there may be frequent discontinuities in the plan where it requests the robot to rotate in place to short-cut an otherwise smooth path for marginal path distance savings.
      #* smoother:
      smooth_path: True                   # For Lattice/Hybrid nodes: Whether or not to smooth the path, always true for 2D nodes.
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true               # Whether to recursively run the smoother 3 times on the results from prior runs to refine the results further

      #! JUST FOR ALGORITHM:
      downsample_costmap: false           # whether or not to downsample the map
      downsampling_factor: 1              # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      #* max_iterations = infinite
      max_iterations: -1             # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # maximum number of iterations to attempt to reach goal once in tolerance
      #* era 3.5 s
      max_planning_time: 40.0              # max time in s for planner to plan, smooth, and upsample. Will scale maximum smoothing and upsampling times based on remaining time after planning.
      angle_quantization_bins: 64         # For Hybrid nodes: Number of angle bins for search, must be 1 for 2D node (no angle search)
      analytic_expansion_ratio: 3.5       # For Hybrid/Lattice nodes: The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_length: 3.0    # For Hybrid/Lattice nodes: The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting (in meters). This should be scaled with minimum turning radius and be no less than 4-5x the minimum radius
      lookup_table_size: 20.0               # For Hybrid nodes: Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: True      # For Hybrid nodes: Cache the obstacle map dynamic programming distance expansion heuristic between subsiquent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.  
      allow_reverse_expansion: False      # For Lattice nodes: Whether to expand state lattice graph in forward primitives or reverse as well, will double the branching factor at each step.   
      

# https://docs.ros.org/en/humble/p/nav2_dwb_controller/
# (DWBLocalPlanner), il controller tenta più traiettorie e prende la meno costosa.
# - BaseObstacle.scale: aumentando questo parametro sfavorisci le
#   traiettorie che vanno in zone costose della local costmap.
# Parametri di default.
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1 #era 0.25
      yaw_goal_tolerance: 0.1 #era 0.25
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


# behaviour server:
# decide cosa fare se il robot è bloccato;
# differential può ruotare sul posto, ma per ora lascio solo backup/drive_on_heading/wait
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2


waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200




local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      #! prova, era: global_frame: map
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true #!sempre true
      #! pose goes off grid, aumento a 5 width e height
      width: 5
      height: 5
      resolution: 0.05
      # robot_radius: 0.22
      footprint: "[[0.15,0.12],[0.15,-0.12],[-0.15,-0.12],[-0.15,0.12]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 #! era 3.0
        # ERA inflation_radius: 0.1, MA NAV2 SI LAMENTAVA
        inflation_radius: 0.5 #!è poco proviamo
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True



global_costmap:
  global_costmap:
    ros__parameters:
      # rolling_window: true #! scommenta se usi slam
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.15,0.12],[0.15,-0.12],[-0.15,-0.12],[-0.15,0.12]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # ERA inflation_radius: 0.1, MA NAV2 SI LAMENTAVA
        inflation_radius: 0.8 #! modificato
      always_send_full_costmap: True


map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True