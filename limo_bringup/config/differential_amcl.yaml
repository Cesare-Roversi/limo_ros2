# Configurazione standard con amcl + map server (spero)
# L'ho scelto tra i limo_ros2_onboard_ws/limo_ros2/limo_bringup/param/
# Originariamente si chiamava nav2_ackermann.yaml, l'ho modificato e gli ho cambiato il nome in tesi_nav2_differential.yaml


amcl:
  ros__parameters:
    set_initial_pose: true
    initial_pose:
      x: 120.000
      y: 32.000
      z: 0.450000
      yaw: 0.0

    use_sim_time: True

    #* QUANTA NOISE SI ASPETTA DALL'ODOMETRIA
    # se si fida salta in giro meno.
    # deafault di tutti è 0.2
    # alpha1: 0.3
    # alpha2: 0.3
    # alpha3: 0.3
    # alpha4: 0.3
    # alpha5: 0.3
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1

    #* TRANSFORMS:
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: True
    transform_tolerance: 0.3
    save_pose_rate: 1.0
    scan_topic: scan
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"

    #* OSTACOLI DINAMICI
    # attivalo solo se metti ostacoli dinamici in simulazione
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    #* SENSORE
    # corrisponde al sensore in gazebo
    laser_model_type: "likelihood_field"
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.5
    max_beams: 360

    # "likelihood_field" usa solo z_hit e z_rand, 
    # in teoria z_hit è la problabilità che un raggio sia corretto
    # z_rand che sia sbagliato
    sigma_hit: 0.2
    z_hit: 0.9 
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    lambda_short: 0.1

    #* PARTICLE FILTER
    # raddoppiato le particelle
    min_particles: 1000 
    max_particles: 4000
    # non oso toccare
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    #* AGGIORNAMENTO
    # ogni quanto aggoirnare la posizione
    # abbassati molto x precisone piccoli movimenti
    update_min_d: 0.1 #radinati
    update_min_a: 0.1 #metri

    #* RECOVERY
    # non oso toccarli
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0



#! behavior trees preinstallati qui:
#! /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/

# bt_navigator
# legge da /odom
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_nav_to_pose_bt_xml: "$(find-pkg-share limo_bringup)/config/behaviour_trees/differential_navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share limo_bringup)/config/behaviour_trees/differential_navigate_through_poses_w_replanning_and_recovery.xml"



#* https://github.com/ros-navigation/navigation2/tree/humble/nav2_smac_planner

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: True
      allow_unknown: True
      tolerance: 1.0




# https://docs.ros.org/en/humble/p/nav2_regulated_pure_pursuit_controller/
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1 #10 cm in massimo
      movement_time_allowance: 60.0 #60 s
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.175  # 10 gradi
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      #* NAVIGAZIONE:
      desired_linear_vel: 0.6
      allow_reversing: true

      # collisioni
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.4 #* quanti secondi nel futuro guardare
      # è una curva in base a velocità lineare e angolare del robot, NON segue la path del planner quindi deve essere un valore basso

      # interpolazione x aggiungere punti alla path
      use_interpolation: true

      #* ROTAZIONE SUL POSTO:
      use_rotate_to_heading: true #* rotate_to_heading == girare sul posto, ackermann non può
      rotate_to_heading_angular_vel: 1.8
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2 #*sempre riferito a rotazione sul posto
      

      #* SCALING NAVIGAZIONE:
      # rallentare alle curve:
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.8 #*raggio sotto il quale diminuisce la velocità
      regulated_linear_scaling_min_speed: 0.15 #*se use_regulated_linear_velocity_scaling: true

      # rallentare vicino a zone ad alto costo nella costmap (I muri tendenzialmente)
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.4 # distanza minima dal quale l'algoritmo diminuisce velocità
      cost_scaling_gain: 0.5 # Velocità Scalata = Velocità Attuale * (cost_scaling_gain * (Distanza Reale / cost_scaling_dist))
      inflation_cost_scaling_factor: 3.0 #!DEVE ESSERE UGUALE A local_costmap / inflation_layer / cost_scaling_factor
      # il controller legge il costo dalla local costmap e vuole ricavare la distanza dall'ostacolo, quindi gli serve di sapere il fattore.

      # rallentare vicino al goal:
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.3

      #* ALGORITMO:
      # quanto vecchio può essere l'ultimo messaggio tf map -> odom (se il computer è lento alzalo)
      transform_tolerance: 0.5

      # distanza carrot = punto che il robot insegue
      lookahead_dist: 0.6

      # ricerca punto planner server path più vicino a base link
      max_robot_pose_search_dist: 10.0 # limite in m a questa ricerca

      #* SCALING ALGORITMO:
      # usa distaza carrot dinamica #!QUANTO TAGLIA LE CURVE?? CERCA!
      use_velocity_scaled_lookahead_dist: true 
      lookahead_time: 0.8 # quanto avanti è il carrot dinamico (minore = + vicino)
      min_lookahead_dist: 0.2 #* se use_velocity_scaled_lookahead_dist: true
      max_lookahead_dist: 0.8 #* se use_velocity_scaled_lookahead_dist: true


# il planner cerca la path a 1 metro (costmap globale)
# il controller rallenta bruscamente se si avvicina a 0.4 metri dal muro (calcolato tramite costmap LOCALE)




# behaviour server:
# decide cosa fare se il robot è bloccato;
# differential può ruotare sul posto, ma per ora lascio solo backup/drive_on_heading/wait
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait", "spin"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    spin:
      plugin: "nav2_behaviors/Spin"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2


waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200




local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      #! prova, era: global_frame: map
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true #!sempre true
      #! pose goes off grid, aumento a 5 width e height
      width: 5
      height: 5
      resolution: 0.05
      # robot_radius: 0.22
      footprint: "[[0.15,0.12],[0.15,-0.12],[-0.15,-0.12],[-0.15,0.12]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 #! era 3.0
        # ERA inflation_radius: 0.1, MA NAV2 SI LAMENTAVA
        inflation_radius: 0.5 #!è poco proviamo
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True



global_costmap:
  global_costmap:
    ros__parameters:
      # rolling_window: true #! scommenta se usi slam
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.15,0.12],[0.15,-0.12],[-0.15,-0.12],[-0.15,0.12]]"
      resolution: 0.05
      track_unknown_space: true #! cambiato adesso
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # ERA inflation_radius: 0.1, MA NAV2 SI LAMENTAVA
        inflation_radius: 0.8 #! modificato
      always_send_full_costmap: True


map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True