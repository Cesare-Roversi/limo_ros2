# Configurazione standard con amcl + map server (spero)
# L'ho scelto tra i limo_ros2_onboard_ws/limo_ros2/limo_bringup/param/
# Originariamente si chiamava nav2_ackermann.yaml, l'ho modificato e gli ho cambiato il nome in tesi_nav2_ackermann.yaml



# AMCL:
# trova il frame_id del sesnore che pubblica su /scan e guarda nel tf tree: base_link -> scan 
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.05
    alpha3: 0.03
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: True
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan 

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True


# bt_navigator
# legge da /odom
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True



controller_server:
  ros__parameters:
    odom_topic: /odom                      # [+] da FILE2
    use_sim_time: True                    # [+] da FILE2
    controller_frequency: 5.0             # [mod] 30.0 → 5.0, allineato a FILE2
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0                          # [mod] 0.2 → 0.0 — Ackermann: nessun moto laterale
      wz_std: 0.4
      vx_max: 0.2                          # [mod] 0.5 → 0.2 — da max_vel_x di FILE2
      vx_min: -0.3                         # [mod] -0.35 → -0.3 — da max_vel_x_backwards di FILE2
      vy_max: 0.0                          # [mod] 0.5 → 0.0 — Ackermann: nessun moto laterale
      wz_max: 0.08                          # ! attento !!
      ax_max: 0.4                          # [mod] 3.0 → 0.4 — da acc_lim_x di FILE2
      ax_min: -0.4                         # [mod] -3.0 → -0.4 — da acc_lim_x di FILE2
      ay_min: 0.0                          # [mod] -3.0 → 0.0 — Ackermann: nessuna acc laterale
      ay_max: 0.0                          # [mod] 3.0 → 0.0 — Ackermann: nessuna acc laterale
      az_max: 0.5                          # [mod] 3.5 → 0.5 — da acc_lim_theta di FILE2
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"            # [mod] "diff_drive" → "Ackermann"
      Ackermann:                           # [mod] sostituisce blocco diff_drive
        plugin: "mppi::AckermannMotionModel"
        min_turning_r: 2.5                 # !attento!!!
        wheelbase: 1.7                     # !attento!!!!
      visualize: false
      critic_index_to_visualize: 0
      reset_period: 1.0
      regenerate_noises: false
      sgf_order: 1
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: true           # [mod] false → true — più conservativo come FILE2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0                   # [mod] 4.0 → 8.0 — analogo a weight_kinematics_nh: 1000 (vincoli non-olonomi critici)
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0                   # [mod] 5.0 → 4.0 — analogo a weight_kinematics_forward_drive: 4.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0                  # [mod] 3.81 → 10.0 — analogo a weight_obstacle: 100.0 di FILE2
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0                  # invariato — già simile a weight_viapoint: 50.0 di FILE2
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0                   # [mod] 2.0 → 3.0 — analogo a weight_kinematics_turning_radius: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      TwirlingCritic:                      # [+] abilitato — penalizza rotazioni brusche, analogo a weight_kinematics_turning_radius di FILE2
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 3.0          # da weight_kinematics_turning_radius: 3.0 di FILE2

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True


# smoother server:
# guarda solo la global_costmap;
# prende in input la path del planner server;
smoother_server:
  ros__parameters:
    # enable_stamped_cmd_vel: true
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True


# behaviour server:
# decide cosa fare se il robot è bloccato;
behavior_server:
  ros__parameters:
    # enable_stamped_cmd_vel: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True


waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200




local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      #! prova, era: global_frame: map
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      #! pose goes off grid, aumento a 5 width e height
      width: 5
      height: 5
      resolution: 0.05
      # robot_radius: 0.22
      footprint: "[[0.15,0.10],[0.15,-0.10],[-0.15,-0.10],[-0.15,0.10]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # ERA inflation_radius: 0.1, MA NAV2 SI LAMENTAVA
        inflation_radius: 0.4
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # ERA inflation_radius: 0.1, MA NAV2 SI LAMENTAVA
        inflation_radius: 0.4
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

